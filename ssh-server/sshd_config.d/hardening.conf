# Ultra-Secure SSH hardening for the WPlib dev server (drop-in config).
# Loaded by /etc/ssh/sshd_config via an Include directive. Keep this file
# free of host-key paths — those live in sshd_config so they survive the
# `ssh_host_keys` volume being mounted over /etc/ssh.
#
# NOTE: every keyword here must be supported by the OpenSSH version in the
# container image (Alpine 3.19 → OpenSSH 9.6). A previous revision carried
# `KerberosAuthentication` / `GSSAPIAuthentication` (unsupported when the
# build has no Kerberos/GSSAPI compiled in) and a `HostKeyAlgorithms` list
# containing `ssh-ed448` (not implemented by OpenSSH at all), which made
# sshd refuse to start with "Bad key types" errors.

# Authentication — KEY ONLY, no passwords of any kind
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
HostbasedAuthentication no
IgnoreRhosts yes

# Public-key signature algorithms we accept. ed448 is intentionally absent:
# OpenSSH does not implement it, and listing it aborts the daemon with
# "Bad key types".
PubkeyAcceptedAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Algorithm policy — modern AEAD/KEX only
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Session limits
MaxAuthTries 2
MaxSessions 1
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 2

# Logging
LogLevel VERBOSE
SyslogFacility AUTH

# Disable unnecessary features
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PrintMotd no
PrintLastLog no

# Restrict to the single dev user
AllowUsers wplib-dev

# SFTP subsystem + chroot for wplib-dev. ChrootDirectory must be owned by
# root:root with no group/world write; the workspaces dir inside it is
# owned by wplib-dev (see Dockerfile).
Subsystem sftp internal-sftp
Match User wplib-dev
    ChrootDirectory /home/wplib-dev/Jarvis/dev/workspaces
    ForceCommand internal-sftp -d /
    PermitTunnel no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
