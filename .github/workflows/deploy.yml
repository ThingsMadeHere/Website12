# ─────────────────────────────────────────────────────────────────────────────
# Deploy — every push to main ships to production AFTER CI passes.
#
# What it does on the server (over SSH):
#   git fetch/checkout main → scripts/deploy.sh
#   (pre-deploy DB backup → reproducible builds → health-gated rollout →
#    automatic rollback on failure)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST        server address (IP or hostname)
#   DEPLOY_USER        ssh user (e.g. deploy)
#   DEPLOY_SSH_KEY     private key (ed25519) whose public key is in
#                      ~DEPLOY_USER/.ssh/authorized_keys on the server
# Optional:
#   DEPLOY_PORT        ssh port (default 22)
#   DEPLOY_PASSPHRASE  if the key has one
#   DEPLOY_PATH (variable)   repo location on the server
#                      (default /opt/mchs/Website12)
#
# Without DEPLOY_HOST configured the deploy job skips gracefully — deploys
# then remain manual: ssh in and run  ./scripts/deploy.sh --pull
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production          # never run two deploys at once
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment is configured
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY not set — skipping remote deploy. See DEPLOYMENT.md §7."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/mchs/Website12' }}
            git fetch origin
            git checkout main
            git reset --hard origin/main
            ./scripts/deploy.sh

      - name: Post-deploy public healthcheck
        if: steps.cfg.outputs.configured == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 8 https://mchsrobotics.dev/api/users/count | grep -q '"count"'; then
              echo "production is serving ✅"; exit 0
            fi
            sleep 6
          done
          echo "::error::public healthcheck failed after deploy"
          exit 1
