services:
  # One-shot service: builds the React frontend and writes output to ./dist
  # Run with: docker compose run --rm build-frontend
  build-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./dist:/app/dist
    command: sh -c "npm install && npm run build"

  # Backend API: accounts, board channels/messages, calendar events
  api:
    build: ./api
    container_name: mchs-api
    restart: unless-stopped
    ports:
      - "3001:3001"   # Exposed for cloudflared tunnel
    environment:
      DATABASE_PATH: /app/data/mchs.db
      PORT: "3001"
    volumes:
      - api_data:/app/data
    networks:
      - proxy

  # Serves the React frontend and proxies /api calls to the backend.
  # NPM (Nginx Proxy Manager) forwards mchsrobotics.dev → mchs-web:80
  web:
    image: nginx:alpine
    container_name: mchs-web
    restart: unless-stopped
    ports:
      - "80:80"     # Exposed for cloudflared tunnel (bypasses NPM)
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

networks:
  # Local network for the application
  proxy:
    driver: bridge

volumes:
  api_data:

