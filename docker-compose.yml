services:
  # One-shot service: builds the React frontend and writes output to ./dist
  # Run with: docker compose run --rm build-frontend   (scripts/deploy.sh does this)
  build-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./dist:/app/dist
    command: sh -c "npm ci && npm run build"   # lockfile-pinned, reproducible

  # Backend API: accounts, board channels/messages, calendar events
  api:
    build: ./api
    container_name: mchs-api
    restart: unless-stopped
    ports:
      - "3001:3001"   # Exposed for cloudflared tunnel
    env_file:
      - ./api/.env    # RESEND_API_KEY / SMTP_* etc. (git-ignored — create on the server)
    environment:
      DATABASE_PATH: /app/data/mchs.db
      PORT: "3001"
      # ── Membership-application review emails ──────────────────────────
      ADMIN_EMAIL: physicsiscool314@gmail.com
      PUBLIC_URL: https://mchsrobotics.dev   # base URL for approve/deny links in emails
      # Credentials live in api/.env (see env_file above):
      #   RESEND_API_KEY=…            (Option A — Resend)
      #   EMAIL_FROM=…                (optional sender override)
      #   SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS  (Option B — any SMTP)
      # With neither option set, emails (incl. approve/deny links) are
      # printed to the container log so the flow still works for testing.
    volumes:
      - api_data:/app/data
    networks:
      - proxy
    # Healthcheck is defined in api/Dockerfile (GET /health every 30 s).
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Serves the React frontend and proxies /api calls to the backend.
  # Starts only after the API reports healthy — nginx resolves the
  # `mchs-api` upstream at boot, so this ordering prevents crash loops.
  web:
    image: nginx:alpine
    container_name: mchs-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"     # Exposed for cloudflared tunnel (bypasses NPM)
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    logging: *default-logging

  # ── Ultra-Secure SSH Server for WPlib Remote Development ───────────────────
  # Only accepts connections from robot IP (10.57.28.2)
  # Provides SFTP access restricted to ~/Jarvis/dev/workspaces
  # Uses key-only authentication with maximum security hardening
  ssh-server:
    build: ./ssh-server
    container_name: wplib-ssh
    restart: unless-stopped
    volumes:
      # Mount your SSH public key for authentication
      - ./ssh-keys/authorized_keys:/home/wplib-dev/.ssh/authorized_keys:ro
      # Persist workspaces directory
      - wplib_workspaces:/home/wplib-dev/Jarvis/dev/workspaces
      # SSH host keys (generated on first run)
      - ssh_host_keys:/etc/ssh
    networks:
      - proxy
    environment:
      # Robot IP for reverse tunnel (optional - robot initiates connection)
      - ROBOT_IP=10.57.28.2
    logging: *default-logging

  # ── Java Compilation Queue Service ─────────────────────────────────────────
  # Handles Java 17/25 compilation for robot code deployment
  # Processes jobs sequentially from queue to prevent conflicts
  java-compiler:
    build: ./java-compiler
    container_name: wplib-compiler
    restart: unless-stopped
    volumes:
      # Shared workspace with SSH server
      - wplib_workspaces:/app/workspaces
      # Compilation queue directory (shared with API)
      - compiler_queue:/app/queue
      # Compilation output/logs
      - compiler_output:/app/output
    networks:
      - proxy
    logging: *default-logging

  # ── Optional: Cloudflare Tunnel edge ────────────────────────────────────
  # Reaches the site without opening any inbound ports. Create a tunnel in
  # the Cloudflare Zero Trust dashboard (Networks → Tunnels), point its
  # public hostname mchsrobotics.dev at http://mchs-web:80, then:
  #   echo "TUNNEL_TOKEN=<token>" >> api/.env   (or export it in the shell)
  #   uncomment this block, and `docker compose up -d cloudflared`
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: mchs-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   networks:
  #     - proxy
  #   depends_on:
  #     - web
  #   logging: *default-logging

networks:
  # Local network for the application
  proxy:
    driver: bridge

volumes:
  api_data:
  wplib_workspaces:
  ssh_host_keys:
  compiler_queue:
  compiler_output:
