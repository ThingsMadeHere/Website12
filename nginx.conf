server {
    listen 80;
    server_name mchsrobotics.dev www.mchsrobotics.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3001 https://mchsrobotics.dev;" always;

    # Hide nginx version
    server_tokens off;

    # API backend (accounts, board, calendar)
    location /api/ {
        client_max_body_size 16m;   # membership applications carry base64 photos
        proxy_pass http://mchs-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security headers for API responses
        proxy_hide_header X-Powered-By;
    }

    # React SPA - serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
